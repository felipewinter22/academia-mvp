services:
  db:
    image: postgres:16-alpine
    container_name: academia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academia_db
    ports:
      - "5432:5432"
    volumes:
      - academia_db_data:/var/lib/postgresql/data

volumes:
  academia_db_data:
